<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoMag 照片裁切工具</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--fg:#3b2e25;--coffee:#6b4f3a;--gold:#b8924a;--line:#e6ddd0;--muted:#8a7c6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--fg:#f1e8dc;--coffee:#d1b08f;--gold:#d3ad66;--line:#3a3128;--muted:#a09384}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#272019;--fg:#f1e8dc;--coffee:#d1b08f;--gold:#d3ad66;--line:#3a3128;--muted:#a09384}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;padding:20px 14px 40px}
main{width:min(100%,440px)}
h1{font-size:20px;letter-spacing:.12em;margin:4px 0 2px;font-weight:600}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 16px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);margin-bottom:14px}
.steps b{color:var(--gold)}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--coffee);background:transparent;color:var(--coffee);border-radius:99px;padding:9px 16px;cursor:pointer;text-align:center}
button.main{background:var(--coffee);color:var(--bg)}
button:disabled{opacity:.4;pointer-events:none}
#pick{width:100%;padding:14px;border-style:dashed;border-radius:12px}
#editor{display:none}
#editor.on{display:block}
#stage{position:relative;width:100%;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none}
canvas#cv{width:100%;height:100%;display:block;cursor:grab}
.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.55) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.55) 66.6%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.55) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.55) 66.6%,transparent 66.8%)}
.ctl{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:13px;color:var(--muted)}
.ctl input{flex:1;accent-color:var(--gold)}
.warn{font-size:12px;color:#c0572b;min-height:18px}
#strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.th{position:relative;flex:0 0 58px;height:58px;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--card);cursor:pointer}
.th.sel{border-color:var(--gold)}
.th canvas{width:100%;height:100%;display:block}
.th i{position:absolute;right:2px;top:2px;background:var(--coffee);color:var(--bg);font-size:10px;font-style:normal;border-radius:99px;padding:0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;min-width:120px}
.tip{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<main>
<h1>Mo<span>Mag</span> 照片裁切</h1>
<p class="sub">先把照片裁成正方形，存回手機，再到訂購表單上傳。拖曳移動位置，雙指或拉桿縮放。</p>
<div class="steps"><span><b>1</b> 選照片</span>›<span><b>2</b> 調整裁切</span>›<span><b>3</b> 儲存</span>›<span><b>4</b> 回表單上傳</span></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<button id="pick">＋ 選擇照片（一次最多 10 張）</button>
<div id="editor">
<div id="strip"></div>
<div id="stage"><canvas id="cv" width="800" height="800"></canvas><div class="grid"></div></div>
<div class="ctl"><span>縮放</span><input id="zoom" type="range" min="1" max="4" step="0.01" value="1"><button id="reset" style="padding:5px 12px">重設</button></div>
<div class="warn" id="warn"></div>
<div class="row">
<button id="save1">儲存這張</button>
<button id="saveAll" class="main">全部儲存</button>
</div>
<div class="row"><button id="del">移除這張</button><button id="more">再加照片</button></div>
</div>
<div class="tip">儲存時，手機會跳出分享選單，請選「儲存影像」。電腦版會直接下載檔案。<br>輸出為 1500 × 1500 像素的正方形 JPG。照片太小時，畫面會出現解析度提醒。</div>
</main>
<script>
const MAXN=10,OUT=1500,NEED=1247;
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
let items=[],cur=-1;
function base(it){return cv.width/Math.min(it.w,it.h)}
function clamp(it){
 const s=base(it)*it.z,half=cv.width/2/s;
 it.cx=Math.min(Math.max(it.cx,half),it.w-half);
 it.cy=Math.min(Math.max(it.cy,half),it.h-half);
}
function draw(){
 ctx.fillStyle=getComputedStyle(document.body).backgroundColor;ctx.fillRect(0,0,cv.width,cv.height);
 if(cur<0)return;
 const it=items[cur];clamp(it);
 const s=base(it)*it.z,ss=cv.width/s;
 ctx.drawImage(it.img,it.cx-ss/2,it.cy-ss/2,ss,ss,0,0,cv.width,cv.height);
 $("warn").textContent=ss<NEED?"⚠ 這張照片的解析度偏低，印出來可能不夠清晰，建議換較大的原圖或少放大一點。":"";
 thumb(cur);
}
function thumb(i){
 const t=items[i].tc,c=t.getContext("2d"),it=items[i];clamp(it);
 const s=base(it)*it.z,ss=cv.width/s;
 c.drawImage(it.img,it.cx-ss/2,it.cy-ss/2,ss,ss,0,0,t.width,t.height);
}
function strip(){
 const st=$("strip");st.innerHTML="";
 items.forEach((it,i)=>{
  const d=document.createElement("div");d.className="th"+(i===cur?" sel":"");
  const t=document.createElement("canvas");t.width=t.height=116;it.tc=t;d.appendChild(t);
  const n=document.createElement("i");n.textContent=i+1;d.appendChild(n);
  d.onclick=()=>select(i);st.appendChild(d);thumb(i);
 });
 $("pick").style.display=items.length?"none":"block";
 $("editor").classList.toggle("on",items.length>0);
 $("more").disabled=items.length>=MAXN;
}
function select(i){cur=i;$("zoom").value=items[i].z;strip();draw()}
$("pick").onclick=$("more").onclick=()=>$("file").click();
$("file").onchange=async e=>{
 const fs=[...e.target.files].slice(0,MAXN-items.length);
 for(const f of fs){
  const url=URL.createObjectURL(f);
  const img=new Image();
  await new Promise(r=>{img.onload=r;img.onerror=r;img.src=url});
  if(!img.naturalWidth)continue;
  items.push({img,w:img.naturalWidth,h:img.naturalHeight,z:1,cx:img.naturalWidth/2,cy:img.naturalHeight/2});
 }
 e.target.value="";
 if(items.length)select(cur<0?0:items.length-fs.length);
};
$("zoom").oninput=e=>{if(cur<0)return;items[cur].z=+e.target.value;draw()};
$("reset").onclick=()=>{const it=items[cur];it.z=1;it.cx=it.w/2;it.cy=it.h/2;$("zoom").value=1;draw()};
$("del").onclick=()=>{items.splice(cur,1);cur=items.length?Math.min(cur,items.length-1):-1;strip();draw();if(cur>=0)$("zoom").value=items[cur].z};
// pointer: drag + pinch
const ptr=new Map();let lastD=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);lastD=0});
cv.addEventListener("pointermove",e=>{
 if(!ptr.has(e.pointerId)||cur<0)return;
 const it=items[cur],prev=ptr.get(e.pointerId),k=cv.width/cv.getBoundingClientRect().width,s=base(it)*it.z;
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===1){it.cx-=(e.clientX-prev[0])*k/s;it.cy-=(e.clientY-prev[1])*k/s}
 else if(ptr.size===2){
  const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(lastD)it.z=Math.min(4,Math.max(1,it.z*d/lastD));lastD=d;$("zoom").value=it.z;
 }
 draw();
});
const up=e=>{ptr.delete(e.pointerId);lastD=0};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{if(cur<0)return;e.preventDefault();const it=items[cur];it.z=Math.min(4,Math.max(1,it.z*(e.deltaY<0?1.06:.94)));$("zoom").value=it.z;draw()},{passive:false});
// export
function render(it){
 const c=document.createElement("canvas");c.width=c.height=OUT;
 clamp(it);const s=base(it)*it.z,ss=cv.width/s;
 const x=c.getContext("2d");x.imageSmoothingQuality="high";
 x.drawImage(it.img,it.cx-ss/2,it.cy-ss/2,ss,ss,0,0,OUT,OUT);
 return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",0.95));
}
async function files(list){
 const out=[];
 for(const i of list){const b=await render(items[i]);out.push(new File([b],"momag-"+String(i+1).padStart(2,"0")+".jpg",{type:"image/jpeg"}))}
 return out;
}
function dl(f){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
async function save(list){
 const fs=await files(list);
 try{
  if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs});return}
 }catch(e){if(e&&e.name==="AbortError")return}
 for(const f of fs){dl(f);await new Promise(r=>setTimeout(r,350))}
}
$("save1").onclick=()=>{if(cur>=0)save([cur])};
$("saveAll").onclick=()=>{if(items.length)save(items.map((_,i)=>i))};
strip();
</script>
</body>
</html>
